name: HACS Action

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS Action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration